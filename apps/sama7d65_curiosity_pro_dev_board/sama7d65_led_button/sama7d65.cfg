# ============================================================
# FTDI + transport
# ============================================================
adapter driver ftdi
ftdi vid_pid 0x0403 0x6011
ftdi channel 0
ftdi layout_init 0x0008 0x000b
ftdi layout_signal nTRST -data 0x10 -oe 0x10
ftdi layout_signal nSRST -data 0x20 -oe 0x20

reset_config trst_and_srst


transport select jtag
adapter speed 100
adapter srst delay 200
adapter srst pulse_width 200

if { [info exists CHIPNAME] } {
    set  _CHIPNAME $CHIPNAME
    } else {
    set  _CHIPNAME sama7d65
 }

if { [info exists CPUTAPID] } {
  set _CPUTAPID $CPUTAPID
} else {
  if { [using_jtag] } {
    set _CPUTAPID 0x6ba00477
  } else {
    set _CPUTAPID 0x6ba02477
  }
}

# ============================================================
# Déclaration des TAP A7
# ============================================================

jtag newtap $_CHIPNAME tap -expected-id $_CPUTAPID -irlen 4

jtag init

set chain [scan_chain]
puts $chain

if {[lsearch $chain "0x6ba00477"] != -1} {
        puts ">>> Cortex-A7 TAP detected"

        dap create $_CHIPNAME.dap -chain-position $_CHIPNAME.tap -ignore-syspwrupack
        # -----------------------------
        # Création target Cortex-A7
        # -----------------------------
        target create $_CHIPNAME.ap0 mem_ap -dap $_CHIPNAME.dap -ap-num 0
        target create $_CHIPNAME.cpu cortex_a -dap $_CHIPNAME.dap -ap-num 0 -coreid 0 -endian little -dbgbase 0x80030000

        $_CHIPNAME.ap0 configure -event examine-start       {
          puts "Performing -event examine-start"
          dap init
          }

        $_CHIPNAME.cpu configure -event reset-deassert-pre  {
          puts "Performing -event reset-deassert-pre"
          $::_CHIPNAME.cpu arp_examine
          }

        $_CHIPNAME.cpu configure -event reset-start {
            puts "Performing -event reset-start"
            adapter speed 50
            puts ">>> A7: slowing down adapter for reset"
        }

        $_CHIPNAME.cpu configure -event reset-deassert-post {
            puts "Performing -event reset-deassert-post"
            puts ">>> A7: attempting early halt"
            for {set i 0} {$i < 50} {incr i} {
                if {[catch {halt 10}] == 0} {
                    puts ">>> A7 halted on attempt $i"
                    break
                }
                sleep 10
            }
        }

        $_CHIPNAME.cpu configure -event reset-init {
            
            puts "Performing -event reset-init"

            echo ">>> Writing NS_WDT_MR and S_WDT_MR to disable reset"
    
            set NS_WDT_MR 0xe001c004
            set S_WDT_MR 0xe001d004

            # Use mdw (memory display word) instead of mrw
            set val [lindex [mdw $NS_WDT_MR 1] 1]
            echo [format "NS_WDT_MR READ: 0x%08X" $val]
            
            set new_val [expr {($val & 0x00FFFFFF) | (1 << 12)}]
            echo [format "NS_WDT_MR WRITE: 0x%08X" $new_val]
            
            # Use mww (memory write word)
            mww $NS_WDT_MR $new_val


            # Use mdw (memory display word) instead of mrw
            set val [lindex [mdw $S_WDT_MR 1] 1]
            echo [format "S_WDT_MR READ: 0x%08X" $val]
            
            set new_val [expr {($val & 0x00FFFFFF) | (1 << 12)}]
            echo [format "S_WDT_MR WRITE: 0x%08X" $new_val]
            
            # Use mww (memory write word)
            mww $S_WDT_MR $new_val

            adapter speed 1000
            puts ">>> A7: adapter speed increased"
        }
    }
